# CONGA-SA7 + CONGA-SEVAL
targets:
 main:
    resources:
      RemotePlace:
        name: conga-sa7
    drivers:
      SSHDriver:
        connection_timeout: 120.0
    hwmon:
      temp: [ 4, 6, 11 ]
      in: [ 1 ]
      curr: [ 1 ]
      fan: [ ]
      in_ranges:
        1: [ 4800, 5200 ]
      curr_ranges:
        1: [ 1000, 2000 ]
