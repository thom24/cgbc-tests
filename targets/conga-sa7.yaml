# CONGA-SA7 + CONGA-SEVAL
targets:
 main:
    resources:
      RemotePlace:
        name: conga-sa7
    drivers:
      SSHDriver:
        connection_timeout: 120.0
    hwmon:
      temp: [ 4, 6, 11 ]
      in: [ 1 ]
      curr: [ 1 ]
      fan: [ ]
      in_ranges:
        1: [ 4800, 5200 ]
      curr_ranges:
        1: [ 1000, 2000 ]
    i2c:
      buses:
        "cgbc-i2c0":
          devices: [ 0x1a, 0x50, 0x51, 0x52, 0x53, 0x54, 0x55, 0x56, 0x57, 0x71 ]
        "cgbc-i2cv":
          devices: [ 0x40, 0x48, 0x50, 0x58, 0x60, 0x68, 0x70 ]
        "cgbc-ddc0":
          devices: []
