# conga-HPC + conga-FEVAL
targets:
 main:
    resources:
      RemotePlace:
        name: conga-hpc
    drivers:
      SSHDriver:
        connection_timeout: 120.0
    hwmon:
      temp: [ 1, 4, 6, 11 ]
      in: [ 1 ]
      curr: [ 1 ]
      fan: [ 1, 2 ]
      in_ranges:
        1: [ 11500, 12500 ]
      curr_ranges:
        1: [ 400, 600 ]
      fan_ranges:
        1: [ 2000, 3000 ]
        2: [ 0, 0 ]
